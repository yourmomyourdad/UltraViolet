<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>

<script type="module">
  import { BareMuxConnection } from "/baremux/index.mjs";

  const form = document.getElementById("form");
  const input = document.getElementById("url");
  const home = document.getElementById("home");
  const browser = document.getElementById("browser");
  const frame = document.getElementById("frame");
  const status = document.getElementById("status");

  let initialized = false;

  async function initialize() {
    try {
      status.textContent = "Initializing...";

      /*
       * Tell BareMux where its worker lives.
       */
      const connection = new BareMuxConnection(
        "/baremux/worker.js"
      );

      /*
       * Connect BareMux to Epoxy.
       *
       * /wisp/ is our WebSocket endpoint.
       */
      await connection.setTransport(
        "/epoxy/index.mjs",
        [
          {
            wisp: `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/wisp/`
          }
        ]
      );

      /*
       * Register the UV service worker.
       */
      await navigator.serviceWorker.register(
        "/uv/uv.sw.js",
        {
          scope: "/service/"
        }
      );

      initialized = true;
      status.textContent = "Ready";
      console.log("Ultraviolet initialized.");

    } catch (error) {
      console.error("Ultraviolet initialization failed:", error);
      status.textContent = "Ultraviolet failed to initialize.";
    }
  }

  function normalize(value) {
    value = value.trim();

    if (!value) {
      return null;
    }

    if (/^https?:\/\//i.test(value)) {
      return value;
    }

    if (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(value)) {
      return "https://" + value;
    }

    return "https://www.google.com/search?q=" +
      encodeURIComponent(value);
  }

  function navigate(value) {
    if (!initialized) {
      status.textContent = "Ultraviolet is still initializing...";
      return;
    }

    const url = normalize(value);

    if (!url) {
      return;
    }

    const proxied =
      __uv$config.prefix +
      __uv$config.encodeUrl(url);

    console.log("Destination:", url);
    console.log("Proxy:", proxied);

    home.style.display = "none";
    browser.style.display = "block";

    frame.src = proxied;
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    navigate(input.value);
  });

  document.querySelectorAll(".quick").forEach(button => {
    button.addEventListener("click", () => {
      navigate(button.dataset.url);
    });
  });

  initialize();
</script>
