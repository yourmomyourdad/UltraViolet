<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>

<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script src="/baremux/index.js"></script>

<script>
  const form = document.getElementById("form");
  const input = document.getElementById("url");
  const home = document.getElementById("home");
  const browser = document.getElementById("browser");
  const frame = document.getElementById("frame");
  const status = document.getElementById("status");

  const connection =
    new BareMux.BareMuxConnection("/baremux/worker.js");

  function normalize(value) {
    value = value.trim();

    if (!value) return null;

    if (/^https?:\/\//i.test(value)) {
      return value;
    }

    if (/^[a-z0-9.-]+\.[a-z]{2,}/i.test(value)) {
      return "https://" + value;
    }

    return "https://www.google.com/search?q=" +
      encodeURIComponent(value);
  }

  async function navigate(value) {
    const url = normalize(value);

    if (!url) return;

    try {
      status.textContent = "Starting proxy...";

      console.log("Registering UV service worker...");

      await navigator.serviceWorker.register("/uv/sw.js");

      console.log("UV service worker registered.");

      const wispUrl =
        (location.protocol === "https:" ? "wss" : "ws") +
        "://" +
        location.host +
        "/wisp/";

      console.log("Wisp:", wispUrl);

      if (
        (await connection.getTransport()) !==
        "/epoxy/index.mjs"
      ) {
        console.log("Setting Epoxy transport...");

        await connection.setTransport(
          "/epoxy/index.mjs",
          [{ wisp: wispUrl }]
        );

        console.log("Epoxy transport ready.");
      }

      const proxied =
        __uv$config.prefix +
        __uv$config.encodeUrl(url);

      console.log("Destination:", url);
      console.log("Proxy:", proxied);

      status.textContent = "Proxy ready.";

      home.style.display = "none";
      browser.style.display = "block";

      frame.src = proxied;

    } catch (error) {
      console.error("Proxy failed:", error);
      status.textContent = "Proxy failed — check Eruda.";
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    navigate(input.value);
  });

  document.querySelectorAll(".quick").forEach(button => {
    button.addEventListener("click", () => {
      navigate(button.dataset.url);
    });
  });

  status.textContent = "Ready for a URL.";
</script>
