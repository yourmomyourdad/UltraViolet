<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ultraviolet</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
    }

    #browser {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #toolbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #151821;
      border-bottom: 1px solid #292d38;
    }

    .button {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: #20242e;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .button:hover {
      background: #2b303c;
    }

    #urlForm {
      flex: 1;
      display: flex;
    }

    #url {
      width: 100%;
      height: 38px;
      padding: 0 15px;

      border: 1px solid #303542;
      border-radius: 20px;

      outline: none;

      background: #20242e;
      color: white;

      font-size: 14px;
    }

    #url:focus {
      border-color: #5865f2;
    }

    #content {
      position: relative;
      flex: 1;
      background: white;
    }

    #welcome {
      position: absolute;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: #0b0d12;
    }

    #welcome h1 {
      margin: 0 0 10px;
      font-size: 42px;
    }

    #welcome p {
      margin: 0;
      opacity: 0.5;
    }

    #frame {
      display: none;

      width: 100%;
      height: 100%;

      border: 0;
      background: white;
    }
  </style>
</head>

<body>

  <div id="browser">

    <div id="toolbar">

      <button class="button" id="back" title="Back">
        ←
      </button>

      <button class="button" id="forward" title="Forward">
        →
      </button>

      <button class="button" id="reload" title="Reload">
        ⟳
      </button>

      <form id="urlForm">
        <input
          id="url"
          type="text"
          placeholder="Search or enter a URL"
          autocomplete="off"
          spellcheck="false"
        >
      </form>

    </div>

    <div id="content">

      <div id="welcome">
        <h1>Ultraviolet</h1>
        <p>Enter a URL to begin</p>
      </div>

      <iframe
        id="frame"
        allow="fullscreen; autoplay"
      ></iframe>

    </div>

  </div>

  <script>
    const form = document.getElementById("urlForm");
    const input = document.getElementById("url");

    const frame = document.getElementById("frame");
    const welcome = document.getElementById("welcome");

    const back = document.getElementById("back");
    const forward = document.getElementById("forward");
    const reload = document.getElementById("reload");

    const history = [];
    let historyIndex = -1;

    function normalizeURL(value) {
      value = value.trim();

      if (!value) {
        return null;
      }

      if (/^https?:\/\//i.test(value)) {
        return value;
      }

      if (
        /^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(value)
      ) {
        return "https://" + value;
      }

      return "https://www.google.com/search?q=" +
        encodeURIComponent(value);
    }

    function navigate(value, addHistory = true) {
      const url = normalizeURL(value);

      if (!url) {
        return;
      }

      /*
       * This is where the Ultraviolet URL encoding
       * will eventually happen.
       *
       * Example:
       *
       * const proxied =
       *   __uv$config.prefix +
       *   __uv$config.encodeUrl(url);
       *
       * frame.src = proxied;
       */

      console.log("Navigate:", url);

      /*
       * TEMPORARY:
       * This proves the frontend works before
       * we install the UV client.
       */
      frame.src = url;

      frame.style.display = "block";
      welcome.style.display = "none";

      input.value = url;

      if (addHistory) {
        history.splice(historyIndex + 1);

        history.push(url);

        historyIndex++;
      }

      updateButtons();
    }

    function updateButtons() {
      back.disabled = historyIndex <= 0;
      forward.disabled =
        historyIndex >= history.length - 1;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      navigate(input.value);
    });

    back.addEventListener("click", () => {
      if (historyIndex <= 0) return;

      historyIndex--;

      navigate(
        history[historyIndex],
        false
      );
    });

    forward.addEventListener("click", () => {
      if (historyIndex >= history.length - 1) {
        return;
      }

      historyIndex++;

      navigate(
        history[historyIndex],
        false
      );
    });

    reload.addEventListener("click", () => {
      if (frame.style.display === "none") {
        return;
      }

      frame.contentWindow.location.reload();
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        input.value = "";
      }
    });

    updateButtons();
  </script>

</body>
</html>
